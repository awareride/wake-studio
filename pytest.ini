# Guard: repo test runs must never collect vendored upstream suites
# (third_party/, ADR-037 Tier 3) - they import heavy deps (tensorflow) and
# use Google's `*_test.py` convention. Suites in this repo are invoked with
# scoped rootdirs (their own pyproject testpaths); this only protects
# ad-hoc runs launched from the repo root.
[pytest]
addopts = --ignore=third_party
