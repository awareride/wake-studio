[project]
name = "studio-backend"
version = "0.1.0"
description = "WakeStudio self-hosted studio-backend (ADR-005 + ADR-036): FastAPI job manager for module train scripts. Runs locally via `uv run wake-service` or inside a Colab session behind a Cloudflare tunnel (launcher glue only - no tunnel code in the service)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  # the openwakeword train adapter (registry engine "direct") writes the
  # training YAML config with the service's own Python (ADR-031)
  "PyYAML>=6.0",
]

[project.scripts]
wake-service = "wake_training_service.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
# Training-time data synthesis (docs/modules/data-sources.md, ADR-022).
# Optional: the data_sources helpers guard the import and raise a clear error
# when the extra is missing.
tts = [
  "edge-tts>=6.1",
]
# Real kws-streaming training env (#159). The vendored upstream
# (third_party/kws_streaming) is 2020-era: it uses Keras 2 + tf.compat.v1
# sessions (tf.keras.backend.set_session / set_learning_phase), which were
# removed in Keras 3 (TF 2.16+), so pin TF 2.15.x - the last Keras-2 line - on
# Python 3.10/3.11. engine=direct registry jobs run with the service's own
# python, so TF must live here (the Colab launcher notebook installs this
# extra: studio-backend[tf] @ git+...). Hardening log: third_party/README.md.
tf = [
  "tensorflow==2.15.1",
  "tensorflow-model-optimization==0.7.5",  # tfmot: upstream quantize layers (#159)
  "numpy==1.26.4",
  "protobuf==3.20.3",
  "absl-py>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wake_training_service", "src/wake_train_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
