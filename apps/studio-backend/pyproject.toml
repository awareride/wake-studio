[project]
name = "studio-backend"
version = "0.1.0"
description = "WakeStudio self-hosted studio-backend (ADR-005 + ADR-036): FastAPI job manager for module train scripts. Runs locally via `uv run wake-service` or inside a Colab session behind a Cloudflare tunnel (launcher glue only - no tunnel code in the service)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  # the openwakeword train adapter (registry engine "direct") writes the
  # training YAML config with the service's own Python (ADR-031)
  "PyYAML>=6.0",
]

[project.scripts]
wake-service = "wake_training_service.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wake_training_service", "src/wake_train_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
