name: Build module artifact (generic)

# Generic module build skeleton (ADR-027 §6.7). One workflow builds any
# module's external artifact (wasm/onnx/models) - it never pre-knows the
# parameters. Each module declares in its spec/module.spec.json `build` block:
#   - script:       module-owned build logic (scripts/build-<id>.mjs)
#   - toolchains:   emsdk / python / uv versions to install
#   - inputs:       the workflow_dispatch inputs (dynamic UI)
# and this workflow does only:
#   checkout -> install toolchains -> run node scripts/build-module.mjs <id>
#   -> upload the artifact dir.
#
# The dynamic input UI is provided by the composite action in
# .github/actions/module-build-inputs (it reads the target module's spec).
# Dispatch a build via: Actions -> "Build module artifact (generic)".
#
# Inputs mirror a module's build.inputs at dispatch time; the "module" input
# selects which module (and thus which spec + script) to build.

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module id to build (from spec meta.id, e.g. kws-sherpa)'
        required: true
        type: string
      inputs_json:
        description: >-
          Optional JSON object of module build inputs overriding the spec
          defaults, e.g. {"checkpoints":"kwt1"}. Keys are the module spec's
          build.inputs ids. Omit to build with every declared default.
        required: false
        type: string
        default: ''
      # GitHub Actions has no dynamic workflow_dispatch inputs, so a module's
      # build.inputs cannot each become their own form field. `inputs_json` is
      # the generic escape hatch: it is expanded into INPUT_<ID> env vars below,
      # which is exactly what scripts/build-module.mjs already reads.

permissions:
  contents: read # artifacts only; no push

jobs:
  build:
    name: Build ${{ github.event.inputs.module }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve module spec (read build.toolchains)
        id: spec
        uses: ./.github/actions/module-spec
        with:
          module: ${{ github.event.inputs.module }}

      - name: Install emsdk
        if: ${{ steps.spec.outputs.emsdk != '' }}
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.spec.outputs.emsdk }}
          actions-cache-folder: 'emsdk-cache'

      - name: Setup Python
        if: ${{ steps.spec.outputs.python != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.spec.outputs.python }}

      - name: Setup uv
        if: ${{ steps.spec.outputs.uv == 'true' }}
        uses: astral-sh/setup-uv@v4

      - name: Expand module build inputs into INPUT_* env vars
        if: ${{ github.event.inputs.inputs_json != '' }}
        env:
          INPUTS_JSON: ${{ github.event.inputs.inputs_json }}
        run: |
          node -e '
            const raw = process.env.INPUTS_JSON || "";
            let obj;
            try { obj = JSON.parse(raw); } catch (e) {
              console.error("::error::inputs_json is not valid JSON: " + e.message);
              process.exit(1);
            }
            if (typeof obj !== "object" || obj === null || Array.isArray(obj)) {
              console.error("::error::inputs_json must be a JSON object");
              process.exit(1);
            }
            const fs = require("fs");
            for (const [k, v] of Object.entries(obj)) {
              const key = "INPUT_" + k.toUpperCase().replace(/-/g, "_");
              const delim = "EOF_" + Math.random().toString(36).slice(2);
              fs.appendFileSync(process.env.GITHUB_ENV, key + "<<" + delim + "\n" + v + "\n" + delim + "\n");
              console.log("forwarding " + key);
            }
          '

      - name: Run module build script
        env:
          # Forward the dispatch inputs to the driver (INPUT_<ID>).
          MODULE_ID: ${{ github.event.inputs.module }}
          ARTIFACT_DIR: ${{ runner.temp }}/artifact
          # Per-module INPUT_* vars (when given) are set by the expand step
          # above via $GITHUB_ENV; build-module.mjs turns them into the
          # --input-<id> flags the module build script documents.
        run: |
          node scripts/build-module.mjs "$MODULE_ID"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.spec.outputs.artifact_name }}
          path: ${{ runner.temp }}/artifact/**
          retention-days: 30
