name: SDK device build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build + tests (${{ matrix.profile }} / ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [app, mcu]
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest runners ship cmake + ninja preinstalled; the device
      # tree is plain CMake, no toolchain install needed (Q13/#35, ADR-040 §5:
      # native host CI first, cross-compile joins the matrix in #186).
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S device -B build -DCMAKE_BUILD_TYPE=Debug -DWAKE_SDK_PROFILE=${{ matrix.profile }}

      - name: Build
        run: cmake --build build -j

      - name: Run tests (L1 + composition-root, ADR-026)
        run: ctest --test-dir build --output-on-failure

      - name: CLI demo smoke (tone triggers, silence does not)
        if: ${{ matrix.profile == 'app' && matrix.cc == 'gcc' }}
        run: |
          python3 - <<'PY'
          import math, struct, wave
          with wave.open('tone.wav','w') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b''.join(struct.pack('<h', int(0.3*32767*math.sin(2*math.pi*440*t/16000))) for t in range(16000*3)))
          with wave.open('silence.wav','w') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
              w.writeframes(b'\x00\x00'*(16000*2))
          PY
          ./build/tools/wake-sdk-demo/wake-sdk-demo tone.wav && echo "tone triggered: OK"
          ! ./build/tools/wake-sdk-demo/wake-sdk-demo silence.wav && echo "silence stayed quiet: OK"

      - name: Python binding smoke (ctypes, #187)
        if: ${{ matrix.profile == 'app' && matrix.cc == 'gcc' }}
        run: |
          python3 packages/sdk/python/wake-sdk-demo.py tone.wav && echo "python tone: OK"
          ! python3 packages/sdk/python/wake-sdk-demo.py silence.wav && echo "python silence: OK"

  app-runtime:
    name: App profile + onnxruntime (openwakeword driver, #192)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pinned onnxruntime prebuilt (ADR-031, issue #192): the openwakeword
      # driver links it and the L1 test runs the real onnx pipeline. The
      # tarball is fetched + sha256-verified by the script, never committed.
      - name: Fetch onnxruntime (pinned 1.21.0)
        run: node scripts/fetch-onnxruntime.mjs

      # The three onnx models (melspectrogram / embedding / hey-buddy
      # classifier) from the models-openwakeword-v1 release (ADR-027).
      - name: Fetch openwakeword model assets
        run: node scripts/fetch-artifact.mjs kws-openwakeword || echo "openwakeword assets fetch failed; L1 runtime test will skip"

      # Stage the models under the names the driver declares (ADR-040 §4.1):
      # melspectrogram.onnx / embedding_model.onnx / classifier.onnx.
      - name: Stage driver model dir
        run: |
          mkdir -p models
          cp packages/modules/kws/openwakeword/assets/openWakeWord/melspectrogram.onnx models/
          cp packages/modules/kws/openwakeword/assets/openWakeWord/embedding_model.onnx models/
          cp packages/modules/kws/openwakeword/assets/hey-buddy/models/hey-buddy.onnx models/classifier.onnx

      - name: Configure (runtime ON)
        run: cmake -S device -B build -DCMAKE_BUILD_TYPE=Debug -DWAKE_SDK_PROFILE=app \
          -DWAKE_SDK_OPENWAKEWORD_HAS_RUNTIME=ON \
          -DWAKE_OPENWAKEWORD_MODEL_DIR=$PWD/models

      - name: Build
        run: cmake --build build -j

      - name: Run tests (real onnx pipeline L1, ADR-026)
        run: ctest --test-dir build --output-on-failure

  cross-mcu:
    name: Cross-compile (Cortex-M4, arm-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      # mcu profile + cross toolchain: build + link only (no board, no OS).
      # Executables (tests/CLI) are host-only and are gated in the top-level
      # CMakeLists by CMAKE_CROSSCOMPILING (#186).
      - name: Configure (mcu profile)
        run: cmake -S device -B build -DWAKE_SDK_PROFILE=mcu -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi.cmake

      - name: Build libraries
        run: cmake --build build -j
