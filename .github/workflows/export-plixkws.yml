name: Export PLiX ONNX

# Manually triggered conversion of the PLiX Few-Shot encoder (.pt -> ONNX).
#
# Why a workflow (not local conversion): per AGENTS.md, Python dependencies
# (torch / torchaudio / timm) must not be installed on the developer machine,
# and `main` is protected (no auto-push). This workflow runs the conversion in
# CI and publishes the result as a **downloadable artifact** (and optionally a
# GitHub Release asset) - it never commits or pushes to the repo.
#
# The exported weights are intentionally NOT committed: `prebuilts/` is
# gitignored (ADR-011 - dev-only / model artifacts are never bundled). The
# browser app serves them from `/prebuilts/plixkws/...` in dev and falls back
# to a remote/CDN URL in deployed builds.
#
# Outputs:
#   - prebuilts/plixkws/plixkws-<encoder>.onnx        (flat ONNX; 'onnx' runtime)
#   - prebuilts/plixkws/hf/plixkws/                    (HF-style dir; 'transformers'
#     runtime local mode): config.json + onnx/model.onnx
#
# Trigger: Actions -> Export PLiX ONNX -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      encoder:
        description: 'PLiX encoder variant'
        required: true
        default: 'base'
        type: choice
        options:
          - base # EfficientNet-v2-M (1280-d)
          - small # TinyNet-E
      language:
        description: 'Language tag for the .pt weights'
        required: false
        default: 'en'
        type: string
      opset:
        description: 'ONNX opset version'
        required: false
        default: '17'
        type: string
      upload_release:
        description: 'Also attach artifacts to a GitHub Release (plixkws-models)'
        required: false
        default: false
        type: boolean

concurrency:
  group: export-plixkws-${{ github.actor }}-${{ github.event.inputs.encoder }}-${{ github.event.inputs.language }}
  cancel-in-progress: true

permissions:
  contents: read # artifacts only; no push (per AGENTS.md)

jobs:
  export:
    name: Export PLiX ${{ github.event.inputs.encoder }}/${{ github.event.inputs.language }} -> ONNX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion toolchain
        # `plixkws` pulls torch, torchaudio, timm. `wget` fetches the Dropbox
        # .pt weights. `onnx` + `onnxscript` are required by torch's modern
        # (torch.export-based) ONNX exporter used by the export script.
        # CPU torch is enough for tracing the export graph.
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir plixkws wget onnx onnxscript

      - name: Download PLiX config manifest
        # Fetch the published PLiX config.json (Dropbox) into
        # prebuilts/plixkws/plixkws-config.json so the export step can use it
        # directly instead of re-fetching from Dropbox at runtime.
        run: |
          mkdir -p prebuilts/plixkws
          wget -q -O prebuilts/plixkws/plixkws-config.json \
            "https://www.dropbox.com/s/ipmytoirguvzg2u/config.json?dl=1"
          echo "Downloaded config (bytes): $(wc -c < prebuilts/plixkws/plixkws-config.json)"

      - name: Run export
        run: |
          python scripts/export-plixkws-onnx.py \
            --encoder "${{ github.event.inputs.encoder }}" \
            --language "${{ github.event.inputs.language }}" \
            --opset "${{ github.event.inputs.opset }}" \
            --config "prebuilts/plixkws/plixkws-config.json" \
            --out "prebuilts/plixkws/plixkws-${{ github.event.inputs.encoder }}.onnx" \
            --hf-dir "prebuilts/plixkws/hf/plixkws"

      - name: Summarize outputs
        run: |
          echo "### PLiX export (${{ github.event.inputs.encoder }}/${{ github.event.inputs.language }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Flat ONNX (onnx runtime):" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "prebuilts/plixkws/plixkws-${{ github.event.inputs.encoder }}.onnx" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HF-style dir (transformers runtime, local mode):" >> "$GITHUB_STEP_SUMMARY"
          ls -lhR "prebuilts/plixkws/hf/plixkws" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plixkws-${{ github.event.inputs.encoder }}-${{ github.event.inputs.language }}
          path: prebuilts/plixkws/**
          retention-days: 30

      - name: Attach to Release (optional)
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag: plixkws-models
          files: |
            prebuilts/plixkws/plixkws-${{ github.event.inputs.encoder }}.onnx
            prebuilts/plixkws/hf/plixkws/config.json
            prebuilts/plixkws/hf/plixkws/onnx/model.onnx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
