name: Build sherpa-onnx KWS WASM

# Manually triggered build of the sherpa-onnx **KWS (keyword spotting) WebAssembly**
# runtime from source.
#
# Why a workflow (per AGENTS.md):
#   - emsdk / emscripten + a full CMake build chain must not be installed on the
#     developer machine.
#   - `main` is protected (no auto-push). This workflow only builds in CI and
#     publishes the result as a **downloadable artifact** - it never commits or
#     pushes to the repo.
#
# What it does (mirrors k2-fsa/sherpa-onnx `build-wasm-simd-kws.sh` +
# `.github/workflows/wasm-simd-hf-space-*.yaml`):
#   1. Install emsdk (pinned to the version the build script expects).
#   2. Checkout sherpa-onnx at SHERPA_VERSION (default v1.13.4, matching the
#      `sherpa-onnx` npm dependency in package.json).
#   3. Download the default KWS model into `wasm/kws/assets` (the CMakeLists.txt
#      FATAL_ERRORs if those files are missing).
#   4. Run `./build-wasm-simd-kws.sh` -> emscripten/cmake build.
#   5. Upload `install/bin/wasm` (the .js/.wasm/.data + demo html) as an artifact.
#
# The built artifacts are intentionally NOT committed (ADR-011 - dev-only /
# model artifacts are never bundled). The browser app serves them from a local
# path or falls back to a CDN in deployed builds.
#
# Trigger: Actions -> Build sherpa-onnx KWS WASM -> Run workflow.
#
# Outputs (artifact `sherpa-onnx-kws-wasm`):
#   install/bin/wasm/
#     sherpa-onnx-wasm-kws-main.js
#     sherpa-onnx-wasm-kws-main.wasm
#     sherpa-onnx-wasm-kws-main.data   (the preloaded KWS model, ~13 MB)
#     sherpa-onnx-kws.js
#     app.js
#     index.html

on:
  workflow_dispatch:
    inputs:
      sherpa_version:
        description: 'sherpa-onnx release tag to build from'
        required: false
        default: 'v1.13.4'
        type: string
      emsdk_version:
        description: 'emsdk (Emscripten) version'
        required: false
        # NOTE: emsdk 3.1.x produces an undefined `std::filesystem` symbol error
        # at link time (wasm-ld: undefined symbol std::__2::filesystem::... in
        # libonnxruntime.a) for the v1.13.4 wasm onnxruntime. The fix pairs
        # sherpa-onnx >= v1.13.4 WASM with emsdk 4.0.x (see k2-fsa/sherpa-onnx
        # PR #3582 / issue #3592). Bump this if you change sherpa_version.
        default: '4.0.23'
        type: string
      kws_model:
        description: 'KWS model release archive (from sherpa-onnx kws-models)'
        required: false
        default: 'sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01.tar.bz2'
        type: string

concurrency:
  group: build-sherpa-onnx-kws-wasm-${{ github.actor }}
  cancel-in-progress: true

permissions:
  contents: read # artifacts only; no push (per AGENTS.md)

jobs:
  build-kws-wasm:
    name: Build sherpa-onnx KWS WASM (${{ github.event.inputs.sherpa_version }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this repo, shallow)
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 1. Emscripten toolchain
      #    mymindstorm/setup-emsdk caches the install in actions-cache-folder
      #    so rebuilds are fast. The version is pinned: sherpa-onnx >= v1.13.4
      #    WASM requires emsdk 4.0.x (3.1.x fails to link `std::filesystem`).
      # ----------------------------------------------------------------------
      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ github.event.inputs.emsdk_version }}
          actions-cache-folder: 'emsdk-cache'

      - name: Verify emsdk
        shell: bash
        run: |
          emcc -v
          echo "--------------------"
          emcc --check

      # ----------------------------------------------------------------------
      # 2. Checkout sherpa-onnx source at the pinned tag
      # ----------------------------------------------------------------------
      - name: Checkout sherpa-onnx source
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: ${{ github.event.inputs.sherpa_version }}
          path: sherpa-onnx-src
          fetch-depth: 1

      # ----------------------------------------------------------------------
      # 3. Download the default KWS model into wasm/kws/assets
      #    The CMakeLists.txt in wasm/kws FATAL_ERRORs unless the four model
      #    files exist, so fetch + flatten before building.
      # ----------------------------------------------------------------------
      - name: Download KWS model assets
        shell: bash
        run: |
          set -euxo pipefail
          cd sherpa-onnx-src/wasm/kws/assets
          URL="https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${{ github.event.inputs.kws_model }}"
          EXPECT_SUB='${{ github.event.inputs.kws_model }}'
          EXPECT_SUB="${EXPECT_SUB%.tar.bz2}"
          # GitHub's CDN occasionally serves a stale/aliased tarball (e.g. the
          # wenetspeech archive for a zh-en request). Verify the extracted dir
          # matches the requested model and retry (with cache-bust) if not.
          for attempt in 1 2 3 4 5; do
            rm -rf ./*
            curl -fsSL "$URL" -o model.tar.bz2 || curl -fsSL "$URL?cb=$attempt" -o model.tar.bz2
            tar xf model.tar.bz2
            rm -f model.tar.bz2
            sub=$(find . -maxdepth 1 -type d ! -name '.' | head -n1)
            echo "attempt $attempt extracted subdir: '$sub' (expect: '$EXPECT_SUB')"
            if [ "${sub##*/}" = "$EXPECT_SUB" ]; then
              mv -v "$sub"/* ./ && rmdir "$sub"
              echo "OK: correct model downloaded"
              break
            fi
            echo "WARN: got wrong model archive, retrying..."
            sleep 10
          done
          ls -lh

      # ----------------------------------------------------------------------
      # 3b. Align the CMakeLists required-asset epoch with the model we actually
      #     downloaded. The CMakeLists hardcodes `decoder-epoch-12-...`; if the
      #     downloaded model is a different epoch (e.g. zh-en-3M-2025-12-20 ships
      #     epoch-13), its FATAL_ERROR asset check fails. Detect the epoch that
      #     is present in assets/ and patch the CMakeLists to match. This works
      #     for any model without relying on the input name.
      # ----------------------------------------------------------------------
      - name: Align CMakeLists asset epoch with downloaded model
        shell: bash
        run: |
          set -euxo pipefail
          f=sherpa-onnx-src/wasm/kws/CMakeLists.txt
          cd sherpa-onnx-src/wasm/kws/assets
          present=$(ls decoder-epoch-*-avg-2-chunk-16-left-64.onnx 2>/dev/null | head -n1 || true)
          echo "present decoder: '$present'"
          if [ -z "$present" ]; then
            echo 'No decoder-epoch-*-avg-2-chunk-16-left-64.onnx found; leaving CMakeLists as-is.'
            exit 0
          fi
          epoch=$(echo "$present" | sed -E 's/decoder-epoch-([0-9]+)-.*/\1/')
          echo "detected epoch: $epoch"
          cd "$GITHUB_WORKSPACE"
          sed -i "s/decoder-epoch-12-avg-2-chunk-16-left-64.onnx/decoder-epoch-${epoch}-avg-2-chunk-16-left-64.onnx/g" "$f"
          echo '--- patched CMakeLists decoder ref ---'; grep -n "decoder-epoch-${epoch}" "$f"

      # Build SINGLE-THREADED (no pthreads) so the wasm needs no
      # SharedArrayBuffer / cross-origin isolation (COOP+COEP). The upstream kws
      # CMakeLists unconditionally appends `-pthread -sPTHREAD_POOL_SIZE=4`;
      # dropping it yields a single-threaded wasm that boots under any static
      # host with no special response headers. The sherpa-onnx KWS glue has no
      # std::thread usage, so a single-threaded build compiles and runs. This
      # avoids the pthread/COEP SAB deadlock that the multithreaded build hits
      # in some browser environments.
      - name: Disable pthreads in KWS wasm build (single-threaded)
        shell: bash
        run: |
          set -euxo pipefail
          f=sherpa-onnx-src/wasm/kws/CMakeLists.txt
          echo '--- PTHREAD before ---'; grep -n 'PTHREAD' "$f"
          sed -i 's/ -pthread -sPTHREAD_POOL_SIZE=4//g' "$f"
          echo '--- PTHREAD after ---'; grep -n 'PTHREAD' "$f" || echo '(pthread flags removed)'

      # ----------------------------------------------------------------------
      # 4. Build the KWS wasm via the upstream build script
      # ----------------------------------------------------------------------
      - name: Build sherpa-onnx KWS WASM
        shell: bash
        run: |
          set -euxo pipefail
          cd sherpa-onnx-src
          # build-wasm-simd-kws.sh honors $EMSCRIPTEN (already on PATH via setup-emsdk).
          ./build-wasm-simd-kws.sh
          echo "----- build output -----"
          ls -lh build-wasm-simd-kws/install/bin/wasm

      # ----------------------------------------------------------------------
      # 5. Summarize + upload artifacts
      # ----------------------------------------------------------------------
      - name: Summarize outputs
        shell: bash
        run: |
          echo "### sherpa-onnx KWS WASM build (${{ github.event.inputs.sherpa_version }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh sherpa-onnx-src/build-wasm-simd-kws/install/bin/wasm >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-kws-wasm
          path: sherpa-onnx-src/build-wasm-simd-kws/install/bin/wasm/**
          retention-days: 30
