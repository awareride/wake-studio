name: Deploy

# Manual deploy to GitHub Pages + Cloudflare Pages (per AGENTS.md: triggered by
# workflow_dispatch only; never runs on push). Pushing to `main` is done by the
# human. REVIEW THIS FILE before the first deploy.
#
# Required repo configuration (set once by the human):
#   - Settings -> Pages -> Source = "GitHub Actions"
#   - Settings -> Environments -> create "github-pages"
#   - Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   - A Cloudflare Pages project named "wake-studio" (ADR-014)
on:
  workflow_dispatch:

jobs:
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetch the sherpa KWS wasm + plixkws/kws-streaming onnx into the module
      # assets dirs
      # (gitignored, ADR-011). The build copies them into dist/ (P0-3).
      - name: Fetch runtime assets
        run: |
          node scripts/fetch-artifact.mjs kws-sherpa || echo "sherpa wasm fetch failed (non-fatal for deploy; backend will 404 until built)"
          node scripts/fetch-artifact.mjs kws-plix || echo "plixkws fetch failed (non-fatal)"
          node scripts/fetch-artifact.mjs kws-streaming || echo "kws-streaming onnx fetch failed (non-fatal; backend will 404 until built)"

      # Project-page sites need a sub-path (ADR-012).
      - name: Build PWA (GitHub Pages base)
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The web app's vite root is apps/web -> build emits apps/web/dist.
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetch runtime assets into module assets dirs before build (P0-3).
      - name: Fetch runtime assets
        run: |
          node scripts/fetch-artifact.mjs kws-sherpa || echo "sherpa wasm fetch failed (non-fatal for deploy; backend will 404 until built)"
          node scripts/fetch-artifact.mjs kws-plix || echo "plixkws fetch failed (non-fatal)"
          node scripts/fetch-artifact.mjs kws-streaming || echo "kws-streaming onnx fetch failed (non-fatal; backend will 404 until built)"

      # Cloudflare Pages serves at root (ADR-012).
      - name: Build PWA (Cloudflare base)
        env:
          VITE_BASE_PATH: /
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ADR-014: the project name is wake-studio (was wave-studio). The
          # web app's vite root is apps/web -> build emits apps/web/dist.
          command: pages deploy apps/web/dist --project-name=wake-studio
